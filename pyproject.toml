[project]
name = "sentinel"
version = "0.0.0"
description = "Small-network anomaly detector"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "vulture", "hypothesis", "deptry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["sentinel", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sentinel --cov-report=term-missing:skip-covered"

[tool.vulture]
paths = ["sentinel"]
min_confidence = 80

[tool.deptry]
known_first_party = ["sentinel"]
