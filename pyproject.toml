[project]
name = "sentinel"
version = "0.1.0"
description = "Small-network anomaly detector"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dpkt>=1.9.8",
    "pydantic>=2.14.1",
]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "vulture", "hypothesis", "deptry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "PLR2004", "PLR0913", "PLR0917"]
"tools/*" = ["S311", "S310"]  # lab attack scripts: seeded randomness, loopback-only URLs

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["sentinel", "tests"]

[[tool.mypy.overrides]]
module = "dpkt.*"
ignore_missing_imports = true  # dpkt ships no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=sentinel --cov-report=term-missing:skip-covered --cov-fail-under=90"
markers = ["security: security test group; must never be empty"]

[tool.vulture]
paths = ["sentinel"]
min_confidence = 80
ignore_names = ["cls"]  # pydantic classmethod validators

[tool.deptry]
known_first_party = ["sentinel"]
